# Netlify configuration for Sudoku Expert.
#
# This is a fully static Next.js app (`output: 'export'`), so Netlify just needs
# to run the build and publish the generated `out/` directory. No Next.js runtime
# plugin or serverless functions are required.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# The service worker must never be cached by the CDN, otherwise users can get
# stuck on a stale worker that refuses to update.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed Next.js assets are immutable and safe to cache aggressively.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
